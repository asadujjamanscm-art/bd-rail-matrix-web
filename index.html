<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BD Rail Matrix</title><link rel="stylesheet" href="styles.css"></head><body><header><div class="brandRow"><div><div class="brand">BD Rail Matrix</div><div class="sub">Station-to-station seat availability</div></div><div class="liveDot">● LIVE</div></div></header><main><section class="card form"><div class="row two"><div class="field"><label>FROM</label><div class="combo"><input id="from" placeholder="Search station" autocomplete="off"><div id="fromMenu" class="menu"></div></div></div><div class="field"><label>TO</label><div class="combo"><input id="to" placeholder="Search station" autocomplete="off"><div id="toMenu" class="menu"></div></div></div></div><div class="row two"><div class="field"><label>DATE</label><input id="date" readonly placeholder="Select date"></div><div class="field"><label>TRAIN</label><div class="combo"><input id="train" placeholder="Number or train name" autocomplete="off"><div id="trainMenu" class="menu"></div></div></div></div><button id="load">LOAD MATRIX</button><div id="status" class="status">Enter route, date and train.</div></section><section id="result" hidden><div class="routeCard"><div class="routeTop"><div id="title" class="trainTitle"></div><div><button id="refresh" class="refreshBtn" title="Refresh availability">↻</button></div></div><div id="route" class="route"></div><div id="loadedAt" class="loadedAt"></div></div><div class="tools"><select id="cls"><option value="">All classes</option></select><input id="filter" placeholder="🔎 Search station"></div><div id="matrix"></div></section><div id="datePicker" class="overlay" aria-hidden="true"><div class="picker"><div class="hero"><div id="heroYear"></div><div id="heroDate"></div></div><div class="dateNav"><button id="prev">‹</button><b id="month"></b><button id="next">›</button></div><div class="week"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div><div id="grid" class="grid"></div></div></div></main><script src="train-data.js"></script><script src="stations.js"></script><script src="app.js"></script></body></html>
