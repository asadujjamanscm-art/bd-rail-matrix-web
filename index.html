<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BD Rail Matrix</title><link rel="stylesheet" href="styles.css"></head><body><header><div class="brandRow"><div><div class="brand">BD Rail Matrix</div><div class="sub">Station-to-station seat availability</div></div><div class="liveDot">● LIVE</div></div></header><main><div class="modeTabs"><button type="button" class="modeTab active" data-mode="matrix">▦ MATRIX</button><button type="button" class="modeTab" data-mode="finder">🚆 TRAIN FINDER</button></div><section class="card form"><div class="row two"><div class="field"><label>FROM</label><div class="combo"><input id="from" placeholder="Search station" autocomplete="off"><div id="fromMenu" class="menu"></div></div></div><div class="field"><label>TO</label><div class="combo"><input id="to" placeholder="Search station" autocomplete="off"><div id="toMenu" class="menu"></div></div></div></div><div class="row two"><div class="field"><label>DATE</label><input id="date" readonly placeholder="Select date"></div><div id="trainField" class="field"><label>TRAIN</label><div class="combo"><input id="train" placeholder="Number or train name" autocomplete="off"><div id="trainMenu" class="menu"></div></div><div id="trainInfo" class="trainInfo">Type train number or name</div></div></div><button id="load">LOAD MATRIX</button><div id="status" class="status">Enter route, date and train.</div></section><section id="finderResult" class="finderResult" hidden><div class="finderHeader"><div><div class="finderEyebrow">TRAINS BETWEEN STATIONS</div><div id="finderRoute" class="finderRoute"></div></div><div id="finderMeta" class="finderMeta"></div></div><div class="finderGroup"><div class="groupTitle"><span class="goingDot"></span> GOING <small>From → To</small></div><div id="outboundList"></div></div><div class="finderGroup"><div class="groupTitle"><span class="returnDot"></span> RETURN <small>To → From</small></div><div id="returnList"></div></div></section><section id="result" hidden><div class="routeCard"><div class="routeTop"><div id="title" class="trainTitle"></div><div><button id="refresh" class="refreshBtn" title="Refresh availability">↻</button></div></div><div id="route" class="route"></div><div id="loadedAt" class="loadedAt"></div></div><div class="tools"><select id="cls"><option value="">All classes</option></select><input id="filter" placeholder="🔎 Search station"></div><div id="matrix"></div></section><div id="breakdownModal" class="overlay" aria-hidden="true"><div class="breakdownSheet" role="dialog" aria-modal="true"><div class="breakdownHead"><div><div class="breakdownEyebrow">CLASS BREAKDOWN</div><div id="breakdownTitle" class="breakdownTitle"></div></div><button id="breakdownClose" class="breakdownClose" type="button" aria-label="Close">×</button></div><div id="breakdownList" class="breakdownList"></div><div class="breakdownTotal"><span>Total</span><strong id="breakdownTotal">0</strong></div></div></div><div id="datePicker" class="overlay" aria-hidden="true"><div class="picker"><div class="hero"><div id="heroYear"></div><div id="heroDate"></div></div><div class="dateNav"><button id="prev">‹</button><b id="month"></b><button id="next">›</button></div><div class="week"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div><div id="grid" class="grid"></div></div></div><footer class="credit">BD Rail Matrix · Built by <strong>Asadujjaman Rony</strong></footer></main><script src="train-data.js"></script><script src="stations.js"></script><script src="app.js"></script></body></html>
